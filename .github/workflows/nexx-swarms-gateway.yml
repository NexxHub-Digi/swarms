name: Nexx Swarms Gateway Tests
on:
  push:
    paths:
      - "nexx_gateway/**"
      - ".github/workflows/nexx-swarms-gateway.yml"
  pull_request:
    paths:
      - "nexx_gateway/**"
      - ".github/workflows/nexx-swarms-gateway.yml"
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r nexx_gateway/requirements.txt pytest httpx
      - run: python -m compileall -q nexx_gateway
      - run: pytest -q nexx_gateway/tests
